<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Mầm Xanh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <a href="index.html" class="auth-logo">Mầm Xanh</a>
  <p class="auth-desc">Chào mừng bạn trở lại! Đăng nhập để tiếp tục mua sắm.</p>

  <div class="input-group">
    <label>Số điện thoại</label>
    <span class="input-icon">📱</span>
    <input id="phone" type="tel" placeholder="Nhập số điện thoại">
  </div>
  
  <div class="input-group">
    <label>Mật khẩu</label>
    <span class="input-icon">🔒</span>
    <input id="password" type="password" placeholder="Nhập mật khẩu">
  </div>

  <button class="btn-primary" onclick="login()">Đăng nhập</button>

  <div class="auth-links">
    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a><br><br>
    <a href="index.html">← Quay lại trang chủ</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
